# Lightweight local test rig: 5 containers standing in for 5 servers.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#   ansible-playbook -i inventory/docker_hosts.yml site.yml
#   docker compose -f docker/docker-compose.yml down -v
#
# Each container runs systemd as PID 1 (privileged + cgroup host) so the
# playbook can manage real services. Static IPs keep the cluster wiring stable.
#
# NOTE: there is deliberately NO "keepalived" container. Keepalived is a daemon
# that runs ON pgha-lb1 and pgha-lb2; the virtual IP (172.28.0.17) is not a
# machine, it is an extra address that appears on whichever LB is MASTER and
# moves to the other one on failure.
#
# Also no published `ports:` — a published port binds to one specific
# container, so it could never follow a floating VIP. Your host routes to
# 172.28.0.0/24 directly, so just connect to the VIP: 172.28.0.17:5000
name: pgha

x-node: &node
  build: .
  privileged: true
  cgroup: host
  tmpfs: [/run, /run/lock, /tmp]
  volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]

services:
  pgha-pg1:
    <<: *node
    container_name: pgha-pg1
    hostname: pgha-pg1
    networks: {pgha: {ipv4_address: 172.28.0.11}}

  pgha-pg2:
    <<: *node
    container_name: pgha-pg2
    hostname: pgha-pg2
    networks: {pgha: {ipv4_address: 172.28.0.12}}

  pgha-pg3:
    <<: *node
    container_name: pgha-pg3
    hostname: pgha-pg3
    networks: {pgha: {ipv4_address: 172.28.0.13}}

  # ---- Load-balancer tier: haproxy + keepalived on BOTH of these ----------
  # The VIP 172.28.0.17 floats between them. MASTER holds it; if its HAProxy
  # dies, keepalived moves the VIP to the other node.
  pgha-lb1:
    <<: *node
    container_name: pgha-lb1
    hostname: pgha-lb1
    networks: {pgha: {ipv4_address: 172.28.0.18}}

  pgha-lb2:
    <<: *node
    container_name: pgha-lb2
    hostname: pgha-lb2
    networks: {pgha: {ipv4_address: 172.28.0.19}}

networks:
  pgha:
    name: pgha
    ipam:
      config:
        - subnet: 172.28.0.0/24
