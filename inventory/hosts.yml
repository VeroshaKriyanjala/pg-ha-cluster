---
# =====================================================================
#  Cluster inventory
#
#  pgcluster group -> PostgreSQL 16 + Patroni + etcd
#  haproxy   group -> HAProxy + Keepalived
#
#  Per-host `server_specs` describe the hardware each node has. They are
#  the single source of truth for:
#    * cpu_cores  -> PostgreSQL parallelism GUCs
#    * memory_mb  -> shared_buffers / effective_cache_size / work_mem / ...
#    * storage    -> (optional) a dedicated data disk to format + mount
#
#  See group_vars/all.yml for how the numbers turn into config, and
#  README.md ("Sizing / auto-tuning") for the formulas.
#
#  storage:
#    device : block device for PGDATA (e.g. /dev/sdb, /dev/nvme1n1).
#             OMIT this key entirely to skip all disk management — the
#             role then just makes sure the data directory exists.
#    fstype : xfs (default) or ext4
#    mount  : where to mount it. Defaults to the per-OS PGDATA parent
#             (/var/lib/pgsql on RHEL, /var/lib/postgresql on Ubuntu).
#    size_gb: informational only (document intended volume size).
# =====================================================================
all:
  vars:
    # SSH login user for every host. Change to match your image.
    ansible_user: rocky

  children:

    pgcluster:
      hosts:
        postgres-1:
          ansible_host: 172.31.100.131
          ansible_user: root
          etcd_name: etcd1
          patroni_name: postgresql-01
          server_specs:
            cpu_cores: 4
            memory_mb: 16384          # 16 GB
            storage:
              device: /dev/sdb
              fstype: xfs
              size_gb: 100
        postgres-2:
          ansible_host: 172.31.100.132
          ansible_user: root
          etcd_name: etcd2
          patroni_name: postgresql-02
          server_specs:
            cpu_cores: 4
            memory_mb: 16384
            storage:
              device: /dev/sdb
              fstype: xfs
              size_gb: 100
        postgres-3:
          ansible_host: 172.31.100.133
          ansible_user: root
          etcd_name: etcd3
          patroni_name: postgresql-03
          server_specs:
            cpu_cores: 4
            memory_mb: 16384
            storage:
              device: /dev/sdb
              fstype: xfs
              size_gb: 100

    haproxy:
      # ---- Keepalived / floating VIP ----------------------------------
      # The virtual IP clients connect to. It is NOT a real machine — it is an
      # extra address that floats between haproxy-1 and haproxy-2, so it must:
      #   * sit in the SAME subnet as the haproxy hosts below, and
      #   * be an address nothing else is using.
      vars:
        vip_address: 172.31.100.17
        vrrp_router_id: 91              # unique per VRRP domain on the LAN
        vrrp_auth_pass: change_me_vrrp  # <= CHANGE ME (same on both nodes)
        # Interface the VIP attaches to. Auto-detected; uncomment to force one.
        # keepalived_interface: ens33

      hosts:
        haproxy-1:
          ansible_host: 172.31.100.18
          ansible_user: root
          keepalived_state: MASTER
          keepalived_priority: 101
          server_specs:
            cpu_cores: 2
            memory_mb: 4096           # 4 GB — informational for LB nodes
        haproxy-2:
          ansible_host: 172.31.100.19
          ansible_user: root
          keepalived_state: BACKUP
          keepalived_priority: 100
          server_specs:
            cpu_cores: 2
            memory_mb: 4096
