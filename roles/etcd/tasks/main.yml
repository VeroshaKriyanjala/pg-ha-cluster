---
- name: Install etcd ({{ ansible_os_family }})
  ansible.builtin.include_tasks: "install-{{ ansible_os_family }}.yml"

- name: Ensure etcd system group exists
  ansible.builtin.group:
    name: etcd
    system: true

- name: Ensure etcd system user exists
  ansible.builtin.user:
    name: etcd
    group: etcd
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/etcd
    create_home: false

- name: Ensure etcd directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"
  loop:
    - /var/lib/etcd
    - /etc/etcd

- name: Deploy etcd environment file
  ansible.builtin.template:
    src: etcd.conf.j2
    dest: /etc/etcd/etcd.conf
    owner: root
    group: etcd
    mode: "0640"
  notify: Restart etcd

- name: Enable and start etcd
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: true
    daemon_reload: true

- name: Flush handlers so etcd restarts before the health check
  ansible.builtin.meta: flush_handlers

- name: Wait for etcd client port to accept connections
  ansible.builtin.wait_for:
    host: "{{ node_ip }}"
    port: "{{ port_etcd_client }}"
    timeout: 60

- name: Verify the etcd member list (once)
  ansible.builtin.command: >
    etcdctl --endpoints=http://{{ node_ip }}:{{ port_etcd_client }} member list
  environment:
    ETCDCTL_API: "3"
  register: etcd_members
  changed_when: false
  retries: 5
  delay: 5
  until: etcd_members.rc == 0
  run_once: true

- name: Show etcd members
  ansible.builtin.debug:
    var: etcd_members.stdout_lines
  run_once: true
