---
# =====================================================================
#  PostgreSQL 16 HA cluster — Patroni + etcd + HAProxy + Keepalived
#
#  Run:  ansible-playbook site.yml
#
#  Order matters:
#    1. base setup (packages, firewall, SELinux, data-disk mount)
#    2. etcd quorum (the DCS Patroni relies on)
#    3. PostgreSQL 16 install
#    4. Patroni bootstrap (auto-tuned from each host's server_specs)
#    5. HAProxy + Keepalived load-balancer tier
#
#  Works on RHEL/Rocky/Alma 9 and Ubuntu 20.04/22.04/24.04 — every role
#  branches on ansible_os_family, so a mixed inventory is fine.
# =====================================================================

- name: Base setup on every host
  hosts: all
  become: true
  roles:
    - common

- name: Bring up the etcd cluster (DCS)
  hosts: pgcluster
  become: true
  roles:
    - etcd

- name: Install PostgreSQL
  hosts: pgcluster
  become: true
  roles:
    - postgresql

- name: Install and bootstrap Patroni
  hosts: pgcluster
  become: true
  roles:
    - patroni

- name: Configure the HAProxy + Keepalived load-balancer tier
  hosts: haproxy
  become: true
  tasks:
    - name: Configure HAProxy
      ansible.builtin.include_role:
        name: haproxy

    # Skipped when enable_keepalived is false; clients then connect straight to
    # a HAProxy node instead of to the virtual IP.
    #   * On AWS a VRRP VIP genuinely cannot work: the VPC only routes to IPs
    #     registered on an ENI, so gratuitous ARP is ignored. Move the IP via
    #     the AWS API, or front the LBs with an NLB, instead.
    #   * In Docker it CAN work (a user-defined network is a normal Linux
    #     bridge, and the containers are privileged). It is off only because the
    #     default test rig runs a single HAProxy — a VIP needs two nodes to
    #     float between. Add a second LB container and flip this on.
    - name: Configure Keepalived (floating VIP)
      ansible.builtin.include_role:
        name: keepalived
      when: enable_keepalived | default(true) | bool
